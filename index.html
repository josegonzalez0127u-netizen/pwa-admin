<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PWA Admin - Panel de Control</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h1, h2 { color: #2c3e50; text-align: center; }
        input, select, textarea { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background-color: #2c3e50; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:hover { background-color: #34495e; }
        .hidden { display: none; }
        .logout-btn { background-color: #e74c3c; margin-top: 20px; }
        .img-input { margin-bottom: 5px; font-size: 12px; }
    </style>
</head>
<body>
    <div id="login-section" class="container">
        <h1>Panel Admin</h1>
        <h2>Iniciar Sesión</h2>
        <input type="email" id="email" placeholder="Correo electrónico">
        <input type="password" id="password" placeholder="Contraseña">
        <button onclick="iniciarSesion()">Entrar</button>
    </div>

    <div id="admin-section" class="container hidden">
        <h1>Crear Publicación</h1>
        
        <label>Sección donde se publicará:</label>
        <select id="seccion">
            <option value="inicio">INICIO</option>
            <option value="escuela">NUESTRA ESCUELA</option>
            <option value="docentes">PERSONAL DOCENTE</option>
            <option value="avisos">AVISOS</option>
            <option value="artisticas">ACTIVIDADES ARTISTICAS</option>
            <option value="valores">VALORES</option>
        </select>

        <label>Título o Texto del aviso:</label>
        <textarea id="texto" rows="4" placeholder="Escribe aquí el mensaje..."></textarea>

        <label>Links de Imágenes (Opcional, hasta 10):</label>
        <input type="text" id="imagenUrl1" class="img-input" placeholder="Link Imagen 1 (Drive)">
        <input type="text" id="imagenUrl2" class="img-input" placeholder="Link Imagen 2 (Drive)">
        <input type="text" id="imagenUrl3" class="img-input" placeholder="Link Imagen 3 (Drive)">
        <input type="text" id="imagenUrl4" class="img-input" placeholder="Link Imagen 4 (Drive)">
        <input type="text" id="imagenUrl5" class="img-input" placeholder="Link Imagen 5 (Drive)">
        <input type="text" id="imagenUrl6" class="img-input" placeholder="Link Imagen 6 (Drive)">
        <input type="text" id="imagenUrl7" class="img-input" placeholder="Link Imagen 7 (Drive)">
        <input type="text" id="imagenUrl8" class="img-input" placeholder="Link Imagen 8 (Drive)">
        <input type="text" id="imagenUrl9" class="img-input" placeholder="Link Imagen 9 (Drive)">
        <input type="text" id="imagenUrl10" class="img-input" placeholder="Link Imagen 10 (Drive)">

        <label>Link de Video (Opcional):</label>
        <input type="text" id="videoUrl" placeholder="Pega el link de YouTube o Drive aquí">

        <label>Link de PDF (Opcional):</label>
        <input type="text" id="pdfUrl" placeholder="Pega el link del PDF aquí">

        <button onclick="publicar()">Publicar</button>
        <button class="logout-btn" onclick="cerrarSesion()">Cerrar Sesión</button>

        <hr style="margin-top:30px; border:1px solid #ccc;">
        <h2>Publicaciones Existentes</h2>
        <div id="lista-publicaciones" style="margin-top:15px;"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBC1z1-LWxPMExp2SmxZhIQFpL2cYjz9KM",
            authDomain: "pwa-escolar-7a9d2.firebaseapp.com",
            projectId: "pwa-escolar-7a9d2",
            storageBucket: "pwa-escolar-7a9d2.firebasestorage.app",
            messagingSenderId: "444090664948",
            appId: "1:444090664948:web:521b7ead26b987c2a79ba1"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let postsCache = []; // Para guardar y poder editar

        function iniciarSesion() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            auth.signInWithEmailAndPassword(email, password)
                .then(() => alert("Sesión iniciada correctamente"))
                .catch((error) => alert("Error: " + error.message));
        }

        function cerrarSesion() { auth.signOut(); }

        auth.onAuthStateChanged((user) => {
            if (user) {
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('admin-section').classList.remove('hidden');
                cargarPublicacionesAdmin();
            } else {
                document.getElementById('login-section').classList.remove('hidden');
                document.getElementById('admin-section').classList.add('hidden');
            }
        });

        function publicar() {
            const seccion = document.getElementById('seccion').value;
            const texto = document.getElementById('texto').value;
            const videoUrl = document.getElementById('videoUrl').value;
            const pdfUrl = document.getElementById('pdfUrl').value;

            if (!texto) { alert("Por favor escribe un texto."); return; }

            // Recopilar hasta 10 imágenes
            let imagenes = {};
            for(let i=1; i<=10; i++){
                let val = document.getElementById('imagenUrl'+i).value;
                if(val) imagenes['imagenUrl'+i] = val;
            }

            db.collection("publicaciones").add({
                seccion: seccion,
                texto: texto,
                imagenes: imagenes, // Guardamos las imágenes como un objeto
                videoUrl: videoUrl,
                pdfUrl: pdfUrl,
                fecha: firebase.firestore.FieldValue.serverTimestamp()
            })
            .then(() => {
                alert("¡Publicación exitosa!");
                document.getElementById('texto').value = '';
                for(let i=1; i<=10; i++) document.getElementById('imagenUrl'+i).value = '';
                document.getElementById('videoUrl').value = '';
                document.getElementById('pdfUrl').value = '';
            })
            .catch((error) => alert("Error al publicar: " + error.message));
        }

        function cargarPublicacionesAdmin() {
            db.collection("publicaciones").orderBy("fecha", "desc").onSnapshot((querySnapshot) => {
                let html = '';
                postsCache = []; // Limpiamos cache
                querySnapshot.forEach((doc) => {
                    const pub = doc.data();
                    pub.id = doc.id;
                    postsCache.push(pub);
                    
                    let cantImgs = pub.imagenes ? Object.keys(pub.imagenes).length : 0;
                    html += `
                    <div style="border:1px solid #ccc; padding:10px; margin-bottom:10px; border-radius:5px;">
                        <p><strong>Sección:</strong> ${pub.seccion}</p>
                        <p><strong>Texto:</strong> ${pub.texto}</p>
                        <p><em>Fotos: ${cantImgs} | Video: ${pub.videoUrl ? 'Sí' : 'No'} | PDF: ${pub.pdfUrl ? 'Sí' : 'No'}</em></p>
                        <button onclick="editarPublicacion('${doc.id}')" style="background:#f39c12; color:white; padding:5px; width:auto; margin-bottom:5px;">Editar</button>
                        <button onclick="borrarPublicacion('${doc.id}')" style="background:#c0392b; color:white; padding:5px; width:auto;">Eliminar</button>
                    </div>`;
                });
                document.getElementById('lista-publicaciones').innerHTML = html;
            });
        }

        function borrarPublicacion(id) {
            if(confirm("¿Seguro que deseas eliminar esta publicación?")) {
                db.collection("publicaciones").doc(id).delete().then(() => alert("Publicación eliminada."));
            }
        }

        function editarPublicacion(id) {
            const pub = postsCache.find(p => p.id === id);
            if(!pub) return;

            document.getElementById('seccion').value = pub.seccion;
            document.getElementById('texto').value = pub.texto;
            
            // Limpiar inputs de imágenes primero
            for(let i=1; i<=10; i++) document.getElementById('imagenUrl'+i).value = '';
            
            // Llenar imágenes si existen
            if(pub.imagenes) {
                for(let key in pub.imagenes) {
                    let num = key.replace('imagenUrl', '');
                    document.getElementById('imagenUrl'+num).value = pub.imagenes[key];
                }
            }

            document.getElementById('videoUrl').value = pub.videoUrl || '';
            document.getElementById('pdfUrl').value = pub.pdfUrl || '';
            
            let btn = document.querySelector('button[onclick="publicar()"]');
            btn.innerText = "Guardar Cambios";
            btn.setAttribute('onclick', `guardarCambios('${id}')`);
            window.scrollTo(0, 0);
        }

        function guardarCambios(id) {
            const seccion = document.getElementById('seccion').value;
            const texto = document.getElementById('texto').value;
            const videoUrl = document.getElementById('videoUrl').value;
            const pdfUrl = document.getElementById('pdfUrl').value;

            let imagenes = {};
            for(let i=1; i<=10; i++){
                let val = document.getElementById('imagenUrl'+i).value;
                if(val) imagenes['imagenUrl'+i] = val;
            }

            db.collection("publicaciones").doc(id).update({
                seccion: seccion,
                texto: texto,
                imagenes: imagenes,
                videoUrl: videoUrl,
                pdfUrl: pdfUrl
            }).then(() => {
                alert("Cambios guardados.");
                document.getElementById('texto').value = '';
                for(let i=1; i<=10; i++) document.getElementById('imagenUrl'+i).value = '';
                document.getElementById('videoUrl').value = '';
                document.getElementById('pdfUrl').value = '';
                let btn = document.querySelector('button[onclick^="guardarCambios"]');
                btn.innerText = "Publicar";
                btn.setAttribute('onclick', 'publicar()');
            });
        }
    </script>
</body>
</html>
