<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PWA Admin - Panel de Control</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        h1, h2 {
            color: #2c3e50;
            text-align: center;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 15px;
            background-color: #2c3e50;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #34495e;
        }
        .hidden {
            display: none;
        }
        .logout-btn {
            background-color: #e74c3c;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <!-- Zona de Login (Solo correo y contraseña) -->
    <div id="login-section" class="container">
        <h1>Panel Admin</h1>
        <h2>Iniciar Sesión</h2>
        <input type="email" id="email" placeholder="Correo electrónico">
        <input type="password" id="password" placeholder="Contraseña">
        <button onclick="iniciarSesion()">Entrar</button>
    </div>

    <!-- Zona de Publicación (Oculta hasta iniciar sesión) -->
    <div id="admin-section" class="container hidden">
        <h1>Crear Publicación</h1>
        
        <label>Sección donde se publicará:</label>
        <select id="seccion">
            <option value="inicio">INICIO</option>
            <option value="escuela">NUESTRA ESCUELA</option>
            <option value="docentes">PERSONAL DOCENTE</option>
            <option value="avisos">AVISOS</option>
            <option value="artisticas">ACTIVIDADES ARTISTICAS</option>
            <option value="valores">VALORES</option>
        </select>

        <label>Texto del aviso:</label>
        <textarea id="texto" rows="4" placeholder="Escribe aquí el mensaje o aviso..."></textarea>

        <label>Link de Imagen (Opcional):</label>
        <input type="text" id="imagenUrl" placeholder="Pega el link de Google Drive aquí">

        <label>Link de Video (Opcional):</label>
        <input type="text" id="videoUrl" placeholder="Pega el link de YouTube o Drive aquí">

        <label>Link de PDF (Opcional):</label>
        <input type="text" id="pdfUrl" placeholder="Pega el link del PDF aquí">

        <button onclick="publicar()">Publicar</button>
        <button class="logout-btn" onclick="cerrarSesion()">Cerrar Sesión</button>

        <hr style="margin-top:30px; border:1px solid #ccc;">
        <h2>Publicaciones Existentes</h2>
        <div id="lista-publicaciones" style="margin-top:15px;"></div>

    </div>

    <!-- SDK de Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script>
        // Configuración de Firebase (Tus llaves)
        const firebaseConfig = {
            apiKey: "AIzaSyBC1z1-LWxPMExp2SmxZhIQFpL2cYjz9KM",
            authDomain: "pwa-escolar-7a9d2.firebaseapp.com",
            projectId: "pwa-escolar-7a9d2",
            storageBucket: "pwa-escolar-7a9d2.firebasestorage.app",
            messagingSenderId: "444090664948",
            appId: "1:444090664948:web:521b7ead26b987c2a79ba1"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Función para iniciar sesión
        function iniciarSesion() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            auth.signInWithEmailAndPassword(email, password)
                .then(() => {
                    alert("Sesión iniciada correctamente");
                })
                .catch((error) => {
                    alert("Error: " + error.message);
                });
        }

        // Función para cerrar sesión
        function cerrarSesion() {
            auth.signOut();
        }

        // Observador de estado de sesión
        auth.onAuthStateChanged((user) => {
            if (user) {
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('admin-section').classList.remove('hidden');
                cargarPublicacionesAdmin(); // <- Agrega esta línea
            } else {
                document.getElementById('login-section').classList.remove('hidden');
                document.getElementById('admin-section').classList.add('hidden');
            }
        });

        // Función para publicar en Firebase
        function publicar() {
            const seccion = document.getElementById('seccion').value;
            const texto = document.getElementById('texto').value;
            const imagenUrl = document.getElementById('imagenUrl').value;
            const videoUrl = document.getElementById('videoUrl').value;
            const pdfUrl = document.getElementById('pdfUrl').value;

            if (!texto) {
                alert("Por favor escribe un texto para la publicación.");
                return;
            }

        // Guardar en Firebase
            db.collection("publicaciones").add({
                seccion: seccion,
                texto: texto,
                imagenUrl: imagenUrl,
                videoUrl: videoUrl,
                pdfUrl: pdfUrl,
                fecha: firebase.firestore.FieldValue.serverTimestamp()
            })
            .then(() => {
                alert("¡Publicación exitosa!");
                // Limpiar campos
                document.getElementById('texto').value = '';
                document.getElementById('imagenUrl').value = '';
                document.getElementById('videoUrl').value = '';
                document.getElementById('pdfUrl').value = '';
            })
            .catch((error) => {
                alert("Error al publicar: " + error.message);
            });
        }

        // Función para cargar y mostrar las publicaciones existentes
        function cargarPublicacionesAdmin() {
            db.collection("publicaciones").orderBy("fecha", "desc").onSnapshot((querySnapshot) => {
                let html = '';
                querySnapshot.forEach((doc) => {
                    const pub = doc.data();
                    html += `
                    <div style="border:1px solid #ccc; padding:10px; margin-bottom:10px; border-radius:5px;">
                        <p><strong>Sección:</strong> ${pub.seccion}</p>
                        <p><strong>Texto:</strong> ${pub.texto}</p>
                        <button onclick="editarPublicacion('${doc.id}', '${pub.seccion}', '${pub.texto.replace(/'/g, "")}', '${pub.imagenUrl || ''}', '${pub.videoUrl || ''}', '${pub.pdfUrl || ''}')" style="background:#f39c12; color:white; padding:5px; width:auto; margin-bottom:5px;">Editar</button>
                        <button onclick="borrarPublicacion('${doc.id}')" style="background:#c0392b; color:white; padding:5px; width:auto;">Eliminar</button>
                    </div>`;
                });
                document.getElementById('lista-publicaciones').innerHTML = html;
            });
        }

        // Función para borrar
        function borrarPublicacion(id) {
            if(confirm("¿Seguro que deseas eliminar esta publicación?")) {
                db.collection("publicaciones").doc(id).delete().then(() => {
                    alert("Publicación eliminada.");
                });
            }
        }

        // Función para editar (Carga los datos en el formulario de arriba)
        function editarPublicacion(id, seccion, texto, imagen, video, pdf) {
            document.getElementById('seccion').value = seccion;
            document.getElementById('texto').value = texto;
            document.getElementById('imagenUrl').value = imagen;
            document.getElementById('videoUrl').value = video;
            document.getElementById('pdfUrl').value = pdf;
            
            // Cambiar el botón de publicar por el de guardar cambios
            let btn = document.querySelector('button[onclick="publicar()"]');
            btn.innerText = "Guardar Cambios";
            btn.setAttribute('onclick', `guardarCambios('${id}')`);
            
            // Subir la pantalla hacia arriba para ver el formulario
            window.scrollTo(0, 0);
        }

        // Función para guardar los cambios
        function guardarCambios(id) {
            db.collection("publicaciones").doc(id).update({
                seccion: document.getElementById('seccion').value,
                texto: document.getElementById('texto').value,
                imagenUrl: document.getElementById('imagenUrl').value,
                videoUrl: document.getElementById('videoUrl').value,
                pdfUrl: document.getElementById('pdfUrl').value
            }).then(() => {
                alert("Cambios guardados.");
                // Limpiar formulario
                document.getElementById('texto').value = '';
                document.getElementById('imagenUrl').value = '';
                document.getElementById('videoUrl').value = '';
                document.getElementById('pdfUrl').value = '';
                // Restaurar botón
                let btn = document.querySelector('button[onclick^="guardarCambios"]');
                btn.innerText = "Publicar";
                btn.setAttribute('onclick', 'publicar()');
            });
        }

    </script>
</body>
</html>
